name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: byte-compile everything (catches syntax errors)
        run: python -m compileall -q app tests
      - name: offline unit tests (fake paperless + fake ollama)
        run: |
          set +e
          {
            echo "== tests/test_title_wait.py =="
            python tests/test_title_wait.py
            echo "title_wait_exit=$?"
            echo "== tests/selftest.py =="
            python tests/selftest.py
            echo "selftest_exit=$?"
          } > /tmp/ci-test-log.txt 2>&1
          cat /tmp/ci-test-log.txt
          grep -q '^title_wait_exit=0$' /tmp/ci-test-log.txt
          grep -q '^selftest_exit=0$' /tmp/ci-test-log.txt
      - name: publish test log to the ci-report branch
        if: always()
        run: |
          test -s /tmp/ci-test-log.txt || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-report --depth=1 || true
          git checkout -B ci-report origin/ci-report 2>/dev/null || git checkout --orphan ci-report
          cp /tmp/ci-test-log.txt ci-test-log.txt
          git add ci-test-log.txt
          git commit -m "ci log for run ${{ github.run_number }} at ${{ github.sha }}" || true
          git push -f origin ci-report

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
